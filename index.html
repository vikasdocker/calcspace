<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fc" />
    <meta name="description" content="Find free calculators for math, money, conversions, health, dates and developer tasks." />
    <link rel="icon" href="/calcspace.svg" type="image/svg+xml" />
    <title>CalcSpace — All-in-one calculator workspace</title>
    <script>
      try {
        const saved = localStorage.getItem('calcspace:theme');
        document.documentElement.dataset.theme = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
