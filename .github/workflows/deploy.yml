name: Deploy production

# Oracle Cloud origin (Caddy container) behind a Cloudflare Tunnel.
# Repository secrets:
#   ORACLE_HOST     public IP or hostname of the VM
#   ORACLE_USER     SSH user (ubuntu)
#   ORACLE_SSH_KEY  private key of the deploy keypair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://calcspace.blueflutex.in
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SITE_URL: https://calcspace.blueflutex.in

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload build to Oracle origin
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -euo pipefail
          echo "$GITHUB_SHA" > dist/version.txt
          rsync -az --delete --chmod=D755,F644 \
            -e "ssh -o StrictHostKeyChecking=yes" \
            dist/ "$ORACLE_USER@$ORACLE_HOST:/opt/calcspace/site/"

      - name: Verify origin
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -euo pipefail
          deployed="$(ssh -o StrictHostKeyChecking=yes "$ORACLE_USER@$ORACLE_HOST" \
            'curl -fsS http://127.0.0.1:8081/version.txt')"
          test "$deployed" = "$GITHUB_SHA"
          ssh -o StrictHostKeyChecking=yes "$ORACLE_USER@$ORACLE_HOST" \
            'curl -fsS http://127.0.0.1:8081/ | grep -q "<title>CalcSpace"'

      - name: Verify edge
        run: |
          set -euo pipefail
          # Cloudflare may challenge datacenter IPs, so a non-200 here is a
          # warning rather than a failed deploy: the origin check above is
          # authoritative.
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -A 'Mozilla/5.0 (compatible; CalcSpaceDeployCheck/1.0)' \
            --retry 6 --retry-delay 5 \
            https://calcspace.blueflutex.in/ || true)"
          if [ "$code" = "200" ]; then
            echo "Edge is serving the site."
          else
            echo "::warning::Cloudflare edge returned HTTP $code for the CI runner (usually bot protection); origin verified successfully."
          fi
